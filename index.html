<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preposições do Rafi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3A5F; --blue:#3A66B0; --green:#0A7A3D; --green-l:#E3F4EA;
  --bank:#EAF2FA; --line:#AEBBD0; --ink:#1B2433; --muted:#5B6678;
  --orange:#E8862A; --gold:#F5B301; --bg:#F6F9FC; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Lexend',Verdana,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:18px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
.bar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700;font-size:14px;letter-spacing:.04em}
.bar .title{flex:1;min-width:160px}
.bar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.bar button:hover{background:rgba(255,255,255,.26)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:18px 16px 28px}
footer{font-size:11px;color:#8A94A6;text-align:center;padding:12px 16px 18px}
h1{color:var(--navy);font-size:clamp(28px,5vw,42px);margin:6px 0 4px;letter-spacing:.01em}
.sub{color:var(--blue);font-weight:700;font-size:clamp(16px,2.6vw,21px);margin:0 0 18px}
.hidden{display:none!important}

/* menu */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
.setbtn{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:4px}
.setbtn:hover{border-color:var(--navy);box-shadow:0 3px 0 var(--navy)}
.setbtn b{color:var(--navy);font-size:20px;text-transform:uppercase}
.setbtn span{color:var(--muted);font-size:15px}
.setbtn.all{background:var(--green);border-color:var(--green);color:#fff}
.setbtn.all b,.setbtn.all span{color:#fff}
.stars-total{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin:14px 0 4px}
.stars-total svg{width:28px;height:28px}
.tiny{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px 2px;margin-left:10px}

/* streak */
.streak{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:#fff;transition:background .25s,border-color .25s,transform .25s}
.dot.on{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.streak .lbl{color:var(--muted);font-size:15px;font-weight:600}
.counter{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
.mini-star{display:inline-block;width:30px;height:30px;vertical-align:middle}

/* question */
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:clamp(14px,3vw,26px)}
.instr{color:var(--navy);font-weight:700;font-size:clamp(16px,2.6vw,20px);letter-spacing:.03em;margin:0 0 10px;text-transform:uppercase}
.sentence{font-size:clamp(24px,5vw,38px);font-weight:700;color:var(--ink);margin:6px 0 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1.25}
.say{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--bank);font-size:24px;display:grid;place-items:center}
.say:hover{border-color:var(--navy)}
.blank{display:inline-block;min-width:150px;border-bottom:5px solid var(--navy);text-align:center;color:var(--green);padding:0 8px}
.scene{display:block;width:100%;max-width:520px;margin:0 auto 18px;border-radius:16px;border:2px solid var(--line);background:#fff}
.note{color:var(--muted);font-size:15px;margin:-8px 0 14px;text-align:center}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fig{background:#fff;border:4px solid var(--line);border-radius:18px;padding:8px;position:relative}
.fig img{width:100%;display:block;border-radius:10px}
.fig:hover:not(:disabled){border-color:var(--navy)}
.fig.ok,.opt.ok,.yn.ok{border-color:var(--green);background:var(--green-l)}
.fig.ok::after,.opt.ok::after,.yn.ok::after{content:"✔";position:absolute;top:8px;right:10px;color:var(--green);font-weight:700;font-size:28px;background:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;border:3px solid var(--green)}
.fig.soft,.opt.soft,.yn.soft{opacity:.38;border-style:dashed;cursor:default}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;background:var(--bank);border:2px solid var(--navy);border-radius:16px;padding:14px}
.opt{position:relative;background:#fff;border:3px solid var(--line);border-radius:14px;min-width:132px;padding:8px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;color:var(--navy);font-size:clamp(15px,2.6vw,19px)}
.opt img{width:80px;height:80px;object-fit:contain}
.opt.txt{min-width:160px;min-height:64px;justify-content:center;font-size:clamp(18px,3vw,24px)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.yns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.yn{position:relative;background:#fff;border:4px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;color:var(--navy);font-size:clamp(20px,4vw,30px);min-height:110px}
.yn img{width:72px;height:72px}
.yn:hover:not(:disabled){border-color:var(--navy)}
.feedback{min-height:34px;margin:16px 0 0;font-size:clamp(17px,2.8vw,22px);font-weight:600;color:var(--blue);text-align:center}
.feedback b{color:var(--navy)}
.intro-words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 16px}
.intro-words .opt{cursor:default;min-width:118px}
.go{display:block;margin:6px auto 0;background:var(--green);border:0;color:#fff;font-weight:700;font-size:22px;padding:14px 34px;border-radius:16px;box-shadow:0 4px 0 #075a2d}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #075a2d}
.go.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(18,32,56,.78);display:grid;place-items:center;padding:16px;z-index:20}
.panel{background:#fff;border-radius:24px;padding:24px;max-width:560px;width:100%;text-align:center;max-height:94vh;overflow:auto}
.panel h2{color:var(--navy);margin:8px 0 6px;font-size:clamp(26px,6vw,38px)}
.panel p{margin:4px 0 16px;color:var(--muted);font-size:clamp(16px,3vw,20px)}
.bigstar{width:min(52vw,230px);height:auto;margin:0 auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.poster{max-width:100%;max-height:74vh;border-radius:12px}
.spark{position:absolute;width:14px;height:14px;background:var(--gold);transform:rotate(45deg);opacity:0}
.starwrap{position:relative;display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .bigstar{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
  .spark{animation:fly 1.1s ease-out .25s both}
  @keyframes pop{0%{transform:scale(.1) rotate(-60deg);opacity:0}70%{transform:scale(1.12) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(45deg) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg) scale(.4)}}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
}
.collect{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0 14px}
.collect svg{width:28px;height:28px}

@media (max-width:620px){
  .figs{grid-template-columns:1fr;max-width:420px;margin:0 auto}
  .yns{grid-template-columns:1fr}
  .opt{min-width:calc(50% - 8px)}
  .opt img{width:64px;height:64px}
}
</style>
</head>
<body>
<div class="bar">
  <div class="title">PREPOSIÇÕES · RAFI</div>
  <button id="btnHome" class="hidden" type="button">← Início</button>
  <button id="btnPoster" type="button">Cartaz das palavras</button>
  <button id="btnSound" type="button" aria-pressed="false">Som: desligado</button>
</div>

<main>
  <!-- MENU -->
  <section id="menu">
    <h1>Onde está?</h1>
    <p class="sub">Acerte 5 seguidas e ganhe uma estrela!</p>
    <div class="stars-total"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg><span>Minhas estrelas: <span id="totalStars">0</span></span><button class="tiny" id="btnReset" type="button">zerar</button></div>
    <div class="sets" id="sets"></div>
  </section>

  <!-- JOGO -->
  <section id="play" class="hidden">
    <div class="streak" aria-label="Acertos seguidos">
      <div class="dots" id="dots"></div>
      <div class="lbl">5 seguidas = <svg class="mini-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg></div>
      <div class="counter" id="counter"></div>
    </div>
    <div class="qcard" id="qcard"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  </section>
</main>

<footer>RAFI · BLOCO DE PREPOSIÇÕES · Pictogramas: ARASAAC (arasaac.org), Governo de Aragão, CC BY-NC-SA</footer>

<!-- estrela (símbolo) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.5 5.7 21.2l1.5-7.1L1.8 9.2 9 8.4z" fill="#F5B301" stroke="#C98A00" stroke-width="1.2" stroke-linejoin="round"/></symbol>
  <symbol id="star-off" viewBox="0 0 24 24"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.5 5.7 21.2l1.5-7.1L1.8 9.2 9 8.4z" fill="#fff" stroke="#AEBBD0" stroke-width="1.2" stroke-linejoin="round"/></symbol>
</svg>

<div id="overlayStar" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="starTitle">
  <div class="panel">
    <div class="starwrap" id="starwrap">
      <svg class="bigstar" viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
    </div>
    <h2 id="starTitle">Muito bem, Rafi!</h2>
    <p>5 certas seguidas. Você ganhou uma estrela!</p>
    <div class="collect" id="collectStar" aria-hidden="true"></div>
    <button class="go" id="starContinue" type="button">Continuar</button>
  </div>
</div>

<div id="overlayPoster" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Cartaz das palavras">
  <div class="panel">
    <img class="poster" id="posterImg" alt="Cartaz com as cinco palavras: em cima, embaixo, ao lado, longe e dentro">
    <button class="go alt" id="posterClose" type="button" style="margin-top:14px">Fechar</button>
  </div>
</div>

<div id="overlayEnd" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="panel">
    <h2 id="endTitle">Terminou!</h2>
    <p id="endText"></p>
    <div class="collect" id="collectEnd" aria-hidden="true"></div>
    <button class="go" id="endAgain" type="button">Jogar de novo</button>
    <button class="go alt" id="endHome" type="button" style="margin-top:12px">Voltar ao início</button>
  </div>
</div>

const $ = s => document.querySelector(s);
const SETS = [
  {id:'A', name:'Marque a figura', desc:'Leia a frase e marque a figura.'},
  {id:'B', name:'Escolha a palavra', desc:'Qual palavra de lugar combina?'},
  {id:'C', name:'Certo ou errado', desc:'A frase combina com a figura?'},
  {id:'D', name:'Monte a frase', desc:'Escolha as partes e monte a frase.'},
  {id:'E', name:'A maquete da caverna', desc:'Peixe, rio, coluna e teto.'},
  {id:'ALL', name:'Tudo em sequência', desc:'Todas as atividades, uma depois da outra.', all:true}
];
const NEED = 5;
let stars = 0, curSet = null, queue = [], idx = 0, streak = 0, setStars = 0, mistake = false, locked = false, sound = false, timer = null;

/* ---------- util ---------- */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for(const c of kids){ if(c==null) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
function img(key, alt, cls){ return el('img',{src:IMG[key],alt:alt||'',class:cls||''}); }
function load(){ try{ stars = parseInt(localStorage.getItem('rafi_prep_stars')||'0',10)||0; }catch(e){ stars=0; } }
function save(){ try{ localStorage.setItem('rafi_prep_stars', String(stars)); }catch(e){} }
function starSvg(on){ const s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.innerHTML = '<use href="#'+(on?'star':'star-off')+'"/>'; return s; }
function fillCollect(target, n){ target.innerHTML=''; const shown = Math.min(n, 30); for(let i=0;i<shown;i++) target.append(starSvg(true)); }

/* ---------- som e voz ---------- */
let actx = null;
function tone(freqs, dur=.12){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); t += dur*.8;
    });
  }catch(e){}
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.toLowerCase()); u.lang='pt-BR'; u.rate=.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sayBtn(text){
  if(!('speechSynthesis' in window)) return null;
  return el('button',{class:'say',type:'button','aria-label':'Ouvir a frase',onclick:()=>speak(text)},'🔊');
}

/* ---------- menu ---------- */
function buildMenu(){
  const box = $('#sets'); box.innerHTML='';
  SETS.forEach(s=>{
    const n = s.all ? Object.values(DATA.sets).flat().filter(i=>i.t!=='intro').length : DATA.sets[s.id].filter(i=>i.t!=='intro').length;
    box.append(el('button',{class:'setbtn'+(s.all?' all':''),type:'button',onclick:()=>startSet(s.id)},
      el('b',{},s.name), el('span',{},s.desc+' · '+n+' perguntas')));
  });
  $('#totalStars').textContent = stars;
}
function showMenu(){
  clearTimeout(timer);
  $('#menu').classList.remove('hidden'); $('#play').classList.add('hidden'); $('#btnHome').classList.add('hidden');
  ['#overlayStar','#overlayEnd'].forEach(o=>$(o).classList.add('hidden'));
  buildMenu();
  window.scrollTo(0,0);
}

/* ---------- jogo ---------- */
function startSet(id){
  curSet = id;
  const order = ['A','B','C','D','E'];
  const raw = id==='ALL' ? order.flatMap(k=>DATA.sets[k]) : DATA.sets[id];
  queue = raw; idx = 0; streak = 0; setStars = 0;
  $('#menu').classList.add('hidden'); $('#play').classList.remove('hidden'); $('#btnHome').classList.remove('hidden');
  $('#overlayEnd').classList.add('hidden');
  drawDots(); render();
}
function drawDots(){
  const d = $('#dots'); d.innerHTML='';
  for(let i=0;i<NEED;i++) d.append(el('span',{class:'dot'+(i<streak?' on':'')}));
}
function scored(){ return queue.filter(i=>i.t!=='intro'); }
function render(){
  clearTimeout(timer);
  if(idx>=queue.length){ return finish(); }
  const it = queue[idx];
  mistake = false; locked = false;
  $('#feedback').textContent = '';
  const done = queue.slice(0,idx).filter(i=>i.t!=='intro').length;
  $('#counter').textContent = it.t==='intro' ? '' : 'Pergunta '+(done+1)+' de '+scored().length;
  const card = $('#qcard'); card.innerHTML='';
  ({intro:rIntro, fig:rFig, pal:rPal, cer:rCer, fra:rFra})[it.t](card, it);
  window.scrollTo({top:0});
}
function next(){ idx++; render(); }
function wrong(hint, btn, keepOthers){
  mistake = true;
  if(streak>0){ streak = 0; drawDots(); }
  tone([300,240],.14);
  $('#feedback').innerHTML = '<b>Olhe de novo.</b> ' + (hint||'');
  if(btn){ btn.classList.add('soft','shake'); btn.disabled = true; }
}
function right(btn, after){
  locked = true;
  if(btn) btn.classList.add('ok');
  tone([660,880],.12);
  $('#feedback').textContent = '';
  let gotStar = false;
  if(!mistake){
    streak++; drawDots();
    if(streak>=NEED) gotStar = true;
  }
  timer = setTimeout(()=>{
    if(gotStar){ award(); } else { (after||next)(); }
  }, gotStar?700:850);
}
function award(){
  stars++; setStars++; save();
  fillCollect($('#collectStar'), stars);
  const wrap = $('#starwrap');
  wrap.querySelectorAll('.spark').forEach(s=>s.remove());
  for(let i=0;i<14;i++){
    const a = i/14*Math.PI*2, r = 110 + (i%3)*20;
    const sp = el('span',{class:'spark'}); sp.style.left='calc(50% - 7px)'; sp.style.top='calc(50% - 7px)';
    sp.style.setProperty('--x', Math.round(Math.cos(a)*r)+'px'); sp.style.setProperty('--y', Math.round(Math.sin(a)*r)+'px');
    wrap.append(sp);
  }
  tone([523,659,784,1047],.16);
  $('#overlayStar').classList.remove('hidden'); $('#starContinue').focus();
}
$('#starContinue').addEventListener('click',()=>{
  $('#overlayStar').classList.add('hidden');
  streak = 0; drawDots(); next();
});
function finish(){
  const n = scored().length;
  $('#endText').textContent = setStars>0
    ? 'Você respondeu '+n+' perguntas e ganhou '+setStars+(setStars===1?' estrela':' estrelas')+' nesta rodada.'
    : 'Você respondeu '+n+' perguntas. Vamos jogar de novo para ganhar estrelas?';
  fillCollect($('#collectEnd'), stars);
  $('#overlayEnd').classList.remove('hidden'); $('#endAgain').focus();
}

/* ---------- tipos de pergunta ---------- */
function instr(t){ return el('p',{class:'instr'},t); }
function sentence(text){ const s = el('div',{class:'sentence'}, el('span',{},text)); const b = sayBtn(text); if(b) s.append(b); return s; }

function rIntro(card, it){
  card.append(instr(it.txt));
  card.append(img(it.img,'Foto da maquete da caverna com os nomes: coluna, caverna, teto, peixe, pedras, rio e mesa','scene'));
  const w = el('div',{class:'intro-words'});
  ['EM CIMA','EMBAIXO','AO LADO','LONGE','DENTRO'].forEach(p=>w.append(el('div',{class:'opt'},img(DATA.P[p],''),p)));
  card.append(w);
  card.append(el('button',{class:'go',type:'button',onclick:next},'Vamos!'));
}

function rFig(card, it){
  card.append(instr('Marque a figura da frase.'));
  card.append(sentence(it.q));
  const opts = shuffle(it.opts.map((k,i)=>({k, ok:i===it.ans})));
  const g = el('div',{class:'figs'});
  opts.forEach((o,i)=>{
    const b = el('button',{class:'fig',type:'button','aria-label':'Figura '+(i+1)}, img(o.k,''));
    b.addEventListener('click',()=>{
      if(locked||b.disabled) return;
      o.ok ? right(b) : wrong('Leia a frase de novo e olhe cada figura.', b);
    });
    g.append(b);
  });
  card.append(g);
}

function rPal(card, it){
  card.append(instr('Escreva a palavra que falta. Toque na palavra certa.'));
  card.append(img(it.img,'Figura da frase','scene'));
  if(it.note) card.append(el('p',{class:'note'},it.note));
  const blank = el('span',{class:'blank'},'   ');
  const s = el('div',{class:'sentence'}, el('span',{},it.pre), blank, el('span',{},it.post));
  const b = sayBtn(it.pre+', '+it.post); if(b) s.append(b);
  card.append(s);
  const box = el('div',{class:'opts'});
  const opts = it.opts.length>3 ? ['EM CIMA','EMBAIXO','AO LADO','LONGE','DENTRO'].filter(w=>it.opts.includes(w)) : shuffle(it.opts);
  opts.forEach(w=>{
    const btn = el('button',{class:'opt',type:'button'}, img(DATA.P[w],''), w);
    btn.addEventListener('click',()=>{
      if(locked||btn.disabled) return;
      if(w===it.ans){ blank.textContent = w; right(btn); }
      else wrong('Olhe a figura e use o cartaz, se precisar.', btn);
    });
    box.append(btn);
  });
  card.append(box);
}

function rCer(card, it){
  card.append(instr('Marque certo ou errado.'));
  card.append(img(it.img,'Figura da cena','scene'));
  card.append(sentence(it.q));
  const g = el('div',{class:'yns'});
  [[true,'CERTO',DATA.SIM],[false,'ERRADO',DATA.NAO]].forEach(([val,label,k])=>{
    const b = el('button',{class:'yn',type:'button'}, img(k,''), label);
    b.addEventListener('click',()=>{
      if(locked||b.disabled) return;
      if(val===it.ok) right(b);
      else wrong(it.ok ? 'A frase combina com a figura.' : (it.why||'Olhe a figura de novo.'), b);
    });
    g.append(b);
  });
  card.append(g);
}

function rFra(card, it){
  card.append(instr('Monte a frase da figura.'));
  card.append(img(it.img,'Figura da frase','scene'));
  const sent = el('div',{class:'sentence'}); card.append(sent);
  const box = el('div',{class:'opts'}); card.append(box);
  const steps = [
    {key:'subj', opts:shuffle(it.subs), ans:it.subj},
    {key:'place', opts:['EM CIMA','EMBAIXO','AO LADO','LONGE','DENTRO'], ans:it.place, picto:true},
    {key:'ref', opts:shuffle(it.refs), ans:it.ref}
  ];
  const got = [];
  let st = 0;
  function paint(){
    sent.innerHTML='';
    const parts = [];
    if(got[0]) parts.push(got[0]); else parts.push(null);
    parts.push('ESTÁ');
    parts.push(got[1]||null); parts.push(got[2]||null);
    parts.forEach(p=> sent.append(p ? el('span',{},p) : el('span',{class:'blank'},'   ')));
    if(st>=3){ sent.lastChild.textContent = got[2]+'.'; sent.lastChild.className=''; const b = sayBtn(got.slice(0,1).concat('ESTÁ',got.slice(1)).join(' ')); if(b) sent.append(b); }
    box.innerHTML='';
    if(st>=3) return;
    const sp = steps[st];
    sp.opts.forEach(w=>{
      const btn = sp.picto ? el('button',{class:'opt',type:'button'}, img(DATA.P[w],''), w) : el('button',{class:'opt txt',type:'button'}, w);
      btn.addEventListener('click',()=>{
        if(locked||btn.disabled) return;
        if(w===sp.ans){
          got[st]=w; st++;
          if(st>=3){ paint(); right(null); } else { tone([660],.08); paint(); }
        } else wrong('Olhe a figura e leia a frase de novo.', btn);
      });
      box.append(btn);
    });
  }
  paint();
}

if(location.search.includes('gabarito')){
  const m = $('#menu'); m.append(el('h1',{},'Conferência'));
  Object.entries(DATA.sets).forEach(([k,arr])=>{
    arr.forEach((it,i)=>{
      const row = el('div',{style:'display:flex;gap:10px;align-items:center;border-top:1px solid #ccd;padding:8px 0;flex-wrap:wrap'});

      if(it.t==='fig'){ row.append(el('span',{},it.q)); it.opts.forEach((o,j)=>row.append(img(o,'',''))); row.querySelectorAll('img').forEach((im,j)=>{im.style.cssText='width:120px;border:4px solid '+(j===it.ans?'#0a7a3d':'#ccc'); }); row.append(el('b',{},' resposta: figura '+(it.ans+1))); }
      else if(it.t==='pal'){ const im=img(it.img,''); im.style.width='140px'; row.append(im, el('span',{},it.pre+' ['+it.ans+'] '+it.post)); }
      else if(it.t==='cer'){ const im=img(it.img,''); im.style.width='140px'; row.append(im, el('span',{},it.q+' → '+(it.ok?'CERTO':'ERRADO'))); }
      else if(it.t==='fra'){ const im=img(it.img,''); im.style.width='140px'; row.append(im, el('span',{},it.subj+' ESTÁ '+it.place+' '+it.ref+'.')); }
      m.append(row);
    });
  });
}
